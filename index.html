<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Football Live - مباريات اليوم</title>
  <meta name="description" content="جميع مباريات كرة القدم اليوم مع المواعيد والنتائج المباشرة.">  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #0b0f19;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: #111827;
      padding: 18px 15px;
      text-align: center;
      border-bottom: 1px solid #202938;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #22c55e;
    }

    .date {
      margin-top: 7px;
      color: #9ca3af;
      font-size: 14px;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 18px 12px 40px;
    }

    .title {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .loading,
    .error,
    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #9ca3af;
    }

    .error {
      color: #ef4444;
    }

    .match {
      background: #111827;
      border: 1px solid #202938;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      transition: 0.2s;
    }

    .match:hover {
      border-color: #374151;
    }

    .league {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      align-items: center;
      gap: 8px;
    }

    .team {
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .team img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
      margin: 0 auto 7px;
    }

    .time {
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      display: block;
      font-size: 11px;
      margin-top: 4px;
      color: #9ca3af;
      font-weight: normal;
    }

    .live {
      color: #22c55e;
    }

    .finished {
      color: #ef4444;
    }

    .score {
      display: block;
      font-size: 13px;
      margin-top: 4px;
      color: #fff;
    }

    .watch {
      width: 100%;
      margin-top: 14px;
      border: none;
      border-radius: 9px;
      padding: 11px;
      background: #22c55e;
      color: #06100a;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .watch:hover {
      opacity: 0.9;
    }
  </style></head><body><header>
  <div class="logo">Football <span>Live</span></div>
  <div class="date" id="date"></div>
</header><main>  <h1 class="title">⚽ مباريات اليوم</h1>  <div id="matches" class="loading">
    جاري تحميل المباريات...
  </div></main><script>

  // =========================
  // التاريخ
  // =========================

  const today = new Date();

  document.getElementById("date").textContent =
    today.toLocaleDateString("ar-MA", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });


  // =========================
  // حالة المباراة
  // =========================

  function getStatus(fixture) {

    const status = fixture.fixture.status.short;

    if (["1H", "2H", "ET", "P"].includes(status)) {
      return {
        text: "مباشر",
        className: "live"
      };
    }

    if (status === "HT") {
      return {
        text: "استراحة",
        className: "live"
      };
    }

    if (["FT", "AET", "PEN"].includes(status)) {
      return {
        text: "انتهت",
        className: "finished"
      };
    }

    if (status === "PST") {
      return {
        text: "تأجلت",
        className: ""
      };
    }

    if (status === "CANC") {
      return {
        text: "ألغيت",
        className: "finished"
      };
    }

    return {
      text: "لم تبدأ",
      className: ""
    };
  }


  // =========================
  // تنسيق الساعة
  // =========================

  function getTime(dateString) {

    const date = new Date(dateString);

    return date.toLocaleTimeString("ar-MA", {
      hour: "2-digit",
      minute: "2-digit"
    });
  }


  // =========================
  // إنشاء بطاقة المباراة
  // =========================

  function createMatch(fixture) {

    const home = fixture.teams.home;
    const away = fixture.teams.away;

    const status = getStatus(fixture);

    const homeScore =
      fixture.goals.home !== null
        ? fixture.goals.home
        : "";

    const awayScore =
      fixture.goals.away !== null
        ? fixture.goals.away
        : "";

    const score =
      homeScore !== "" || awayScore !== ""
        ? `<span class="score">${homeScore} - ${awayScore}</span>`
        : "";

    return `
      <div class="match">

        <div class="league">
          ${fixture.league.name}
        </div>

        <div class="teams">

          <div class="team">

            <img
              src="${home.logo || ""}"
              alt=""
              loading="lazy"
              onerror="this.style.display='none'"
            >

            ${home.name}

          </div>


          <div class="time">

            ${getTime(fixture.fixture.date)}

            <span class="status ${status.className}">
              ${status.text}
            </span>

            ${score}

          </div>


          <div class="team">

            <img
              src="${away.logo || ""}"
              alt=""
              loading="lazy"
              onerror="this.style.display='none'"
            >

            ${away.name}

          </div>

        </div>


        <button
          class="watch"
          onclick="openMatch(${fixture.fixture.id})"
        >
          مشاهدة المباراة
        </button>

      </div>
    `;
  }


  // =========================
  // فتح صفحة المباراة
  // =========================

  function openMatch(id) {

    window.location.href =
      "/match.html?id=" + encodeURIComponent(id);

  }


  // =========================
  // تحميل المباريات
  // =========================

  async function loadMatches() {

    const container =
      document.getElementById("matches");

    try {

      const response =
        await fetch("/matches");

      if (!response.ok) {
        throw new Error("API Error");
      }

      const data =
        await response.json();


      if (!data.response ||
          data.response.length === 0) {

        container.innerHTML = `
          <div class="empty">
            لا توجد مباريات اليوم.
          </div>
        `;

        return;
      }


      // ترتيب المباريات حسب وقت البداية

      data.response.sort((a, b) => {

        return new Date(a.fixture.date) -
               new Date(b.fixture.date);

      });


      // عرض المباريات

      container.innerHTML =
        data.response
          .map(createMatch)
          .join("");


    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="error">

          وقع مشكل أثناء تحميل المباريات.

          <br><br>

          حاول تحديث الصفحة.

        </div>
      `;
    }
  }


  // تشغيل التحميل

  loadMatches();

</script></body>
</html>
