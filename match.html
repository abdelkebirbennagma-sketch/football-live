← العودة إلى مباريات اليوم

  </a></header><main>  <div
    id="content"
    class="loading"
  >
    جاري تحميل المباراة...
  </div></main><script>


  const params =
    new URLSearchParams(
      window.location.search
    );


  const fixtureId =
    params.get("id");


  function getStatus(status) {

    if (
      ["1H", "2H", "ET", "P"].includes(status)
    ) {
      return "مباشر";
    }

    if (status === "HT") {
      return "استراحة";
    }

    if (
      ["FT", "AET", "PEN"].includes(status)
    ) {
      return "انتهت";
    }

    if (status === "PST") {
      return "تأجلت";
    }

    if (status === "CANC") {
      return "ألغيت";
    }

    return "لم تبدأ";
  }


  function getTime(dateString) {

    return new Date(
      dateString
    ).toLocaleTimeString(
      "ar-MA",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  async function loadFixture() {

    const content =
      document.getElementById("content");


    if (!fixtureId) {

      content.innerHTML = `

        <div class="error">

          لم يتم تحديد المباراة.

        </div>

      `;

      return;

    }


    try {


      const response =
        await fetch(
          "/fixture?id=" +
          encodeURIComponent(fixtureId),
          {
            cache: "no-store"
          }
        );


      const text =
        await response.text();


      let data;


      try {

        data = JSON.parse(text);

      } catch {

        throw new Error(
          "الخادم أرسل استجابة غير صحيحة."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.details
            ? JSON.stringify(data.details)
            : data.error ||
              "خطأ في الخادم."
        );

      }


      if (
        data.errors &&
        Object.keys(data.errors).length > 0
      ) {

        throw new Error(
          JSON.stringify(data.errors)
        );

      }


      if (
        !data.response ||
        data.response.length === 0
      ) {

        throw new Error(
          "لم يتم العثور على المباراة."
        );

      }


      const fixture =
        data.response[0];


      const home =
        fixture.teams.home;

      const away =
        fixture.teams.away;


      const status =
        fixture.fixture.status.short;


      const homeScore =
        fixture.goals.home !== null
          ? fixture.goals.home
          : "-";


      const awayScore =
        fixture.goals.away !== null
          ? fixture.goals.away
          : "-";


      document.title =
        home.name +
        " vs " +
        away.name +
        " - Football Live";


      content.innerHTML = `

        <div class="player">

          <div class="player-content">

            <div class="player-icon">
              ▶
            </div>

            <div class="player-title">
              البث المباشر
            </div>

            <div class="player-text">
              جاري تجهيز مصدر البث...
            </div>

          </div>

        </div>


        <div class="match-card">


          <div class="league">
            ${fixture.league.name}
          </div>


          <div class="teams">


            <div class="team">

              <img
                src="${home.logo || ""}"
                alt=""
                onerror="this.style.display='none'"
              >

              ${home.name}

            </div>


            <div class="center">

              <div class="time">
                ${getTime(
                  fixture.fixture.date
                )}
              </div>

              <div class="status">
                ${getStatus(status)}
              </div>

              <div class="score">
                ${homeScore} - ${awayScore}
              </div>

            </div>


            <div class="team">

              <img
                src="${away.logo || ""}"
                alt=""
                onerror="this.style.display='none'"
              >

              ${away.name}

            </div>


          </div>


          <div class="info">


            <div class="info-row">

              <span>
                البطولة
              </span>

              <span>
                ${fixture.league.name}
              </span>

            </div>


            <div class="info-row">

              <span>
                الملعب
              </span>

              <span>
                ${
                  fixture.fixture.venue?.name ||
                  "غير متوفر"
                }
              </span>

            </div>


            <div class="info-row">

              <span>
                الحالة
              </span>

              <span>
                ${getStatus(status)}
              </span>

            </div>


          </div>


        </div>

      `;


    } catch (error) {

      console.error(
        "Fixture error:",
        error
      );


      content.innerHTML = `

        <div class="error">

          تعذر تحميل معلومات المباراة.

          <br><br>

          حاول تحديث الصفحة.

          <div class="debug">
            ${error.message}
          </div>

        </div>

      `;

    }

  }


  loadFixture();


</script></body></html>
